<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emulador GBA</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #ccc; user-select: none; }
/* El alto de #container descuenta las dos barras superiores (título 32 + pestañas
   31). Con la barra de pestañas sin descontar, el contenido se salía de la
   ventana por abajo y el botón de ABAJO quedaba sin poder pulsar. */

#titlebar {
  display: flex; align-items: center; justify-content: space-between;
  height: 32px; padding: 0 12px; background: #1a1a2e;
  -webkit-app-region: drag;
}
#titlebar span { font-size: 12px; color: #888; letter-spacing: 0.5px; }
#titlebar button {
  -webkit-app-region: no-drag;
  background: none; border: none; color: #666; font-size: 16px; cursor: pointer;
  width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
#titlebar button:hover { background: #c33; color: #fff; }

#gba-mount { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
/* EJS crea su propio canvas dentro de #gba-mount; le obligamos a llenar el marco */
#gba-mount canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
/* la barra de EJS no la queremos: el chrome de esta página ya trae sus controles */
#gba-mount .ejs_menu_bar,
#gba-mount .ejs_context_menu,
#gba-mount .ejs_menu_button,
#gba-mount .ejs_start_screen,
#gba-mount .ejs_start_button { display: none !important; }

#container {
  display: flex; flex-direction: column; align-items: center;
  height: calc(100% - 63px); padding: 12px; gap: 10px;
  justify-content: center; overflow: hidden;
}

#screen-wrapper {
  position: relative; width: 720px; height: 480px; flex-shrink: 0;
  background: #000; border-radius: 8px; overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.3);
  flex-shrink: 0;
}
#screen-wrapper.loading::after {
  content: 'Cargando ROM…'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #555; letter-spacing: 1px;
}
#screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

#error-overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; padding: 20px; text-align: center;
}
#error-overlay.visible { display: flex; }
#error-overlay .icon { font-size: 36px; }
#error-overlay .msg { font-size: 13px; color: #f88; max-width: 400px; line-height: 1.4; }
#error-overlay .actions { display: flex; gap: 8px; margin-top: 8px; }
#error-overlay button {
  padding: 8px 24px; border: none; border-radius: 6px;
  background: #444; color: #fff; font-size: 12px; cursor: pointer; transition: background 0.15s;
}
#error-overlay button:hover { background: #666; }

#controls {
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center;
}

#dpad { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
#dpad button {
  position: absolute; width: 32px; height: 32px; border: none; border-radius: 4px;
  background: #2a2a3e; color: #888; font-size: 14px; cursor: pointer;
  transition: background 0.1s, transform 0.1s; display: flex; align-items: center; justify-content: center;
}
#dpad button:active, #dpad button.pressed { background: #446; color: #aae; transform: scale(0.92); }
#dpad-up { top: 0; left: 36px; }
#dpad-down { bottom: 0; left: 36px; }
#dpad-left { left: 0; top: 36px; }
#dpad-right { right: 0; top: 36px; }

#face-buttons { display: flex; gap: 8px; }
#face-buttons button {
  width: 44px; height: 44px; border-radius: 50%; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.1s, transform 0.1s;
}
#face-buttons button:active, #face-buttons button.pressed { transform: scale(0.88); }
#btn-a { background: #2a3a3e; color: #8cf; }
#btn-a:active, #btn-a.pressed { background: #1a4a5e; color: #aef; }
#btn-b { background: #3e2a2a; color: #f8a; }
#btn-b:active, #btn-b.pressed { background: #5e1a1a; color: #fcc; }

#shoulder-buttons { display: flex; gap: 6px; }
#shoulder-buttons button {
  width: 42px; height: 26px; border: none; border-radius: 6px 6px 0 0;
  background: #2a2a3e; color: #888; font-size: 11px; font-weight: 600; cursor: pointer;
  transition: background 0.1s, transform 0.1s;
}
#shoulder-buttons button:active, #shoulder-buttons button.pressed { background: #446; color: #aae; transform: scaleY(0.9); }

#sys-buttons { display: flex; gap: 10px; }
#sys-buttons button {
  padding: 6px 14px; border: none; border-radius: 4px;
  background: #2a2a3e; color: #888; font-size: 10px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px;
  transition: background 0.1s;
}
#sys-buttons button:active, #sys-buttons button.pressed { background: #554; color: #ee4; }

/* ── Pestañas ──────────────────────────────────────────────────────────── */
#tabbar {
  display: flex; gap: 2px; flex-shrink: 0;
  background: #14141a; border-bottom: 1px solid #1a1a2e; padding: 0 8px;
}
#tabbar button {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: #666; font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
  padding: 7px 14px; cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
#tabbar button:hover { color: #aaa; }
#tabbar button.activo { color: #c4a0f0; border-bottom-color: #7c5cf0; }
#tabbar button .contador {
  display: inline-block; min-width: 15px; margin-left: 6px; padding: 0 4px;
  border-radius: 7px; background: #7f1d1d; color: #fca5a5;
  font-size: 9px; line-height: 14px; vertical-align: 1px;
}

/* ── Panel Registro ────────────────────────────────────────────────────── */
#log-panel { display: none; height: calc(100% - 63px); overflow: hidden; background: #0d0d0d; }
#log-panel.activo { display: flex; flex-direction: column; }

#diag {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: #1a1a1e; flex-shrink: 0;
  border-bottom: 1px solid #1a1a1e;
}
#diag .celda { background: #0d0d0d; padding: 7px 10px; }
#diag .celda .k {
  font-size: 8px; text-transform: uppercase; letter-spacing: 0.7px;
  color: #4a4a5a; display: block; margin-bottom: 2px;
}
#diag .celda .v { font-family: monospace; font-size: 11px; color: #c4a0f0; }
#diag .celda .v.malo { color: #f87171; }
#diag .celda .v.ok { color: #4ade80; }

#log-list {
  flex: 1; overflow: auto; padding: 6px 10px;
  font-family: monospace; font-size: 11px; line-height: 1.5;
  user-select: text;
}
#log-list .l { white-space: pre-wrap; word-break: break-word; color: #7fbf7f; }
#log-list .l.info { color: #7fbf7f; }
#log-list .l.ok { color: #4ade80; }
#log-list .l.warn { color: #fbbf24; }
#log-list .l.error { color: #f87171; }
#log-list .l.head { color: #6b7280; }
#log-vacio { padding: 12px; color: #3a3a4a; font-family: monospace; font-size: 11px; }

#log-panel .toolbar {
  display: flex; gap: 6px; align-items: center; flex-shrink: 0;
  padding: 5px 10px; background: #14141a; border-bottom: 1px solid #1a1a1e;
}
#log-panel .toolbar button {
  background: transparent; border: 1px solid #1a1a1e; border-radius: 4px;
  color: #888; font-size: 10px; cursor: pointer; padding: 3px 8px;
  font-family: inherit;
}
#log-panel .toolbar button:hover { background: #2a2a3e; color: #ccc; }
#log-panel .toolbar .crece { margin-left: auto; color: #4a4a5a; font-size: 9px; }

#status { font-size: 10px; color: #555; text-align: center; }
#status .fps { color: #484; margin-left: 12px; }
#keys-hint { font-size: 9px; color: #3a3a4a; text-align: center; }
</style>
</head>
<body>

<div id="titlebar">
  <span>🎮 Emulador GBA</span>
  <button id="btn-close" title="Cerrar (Esc)">✕</button>
</div>

<div id="tabbar">
  <button id="tab-juego" class="activo">Juego</button>
  <button id="tab-log">Registro<span id="log-contador" class="contador" hidden>0</span></button>
</div>

<div id="container">
  <div id="screen-wrapper" class="loading">
    <div id="gba-mount" tabindex="0"></div>
    <div id="error-overlay">
      <div class="icon">⚠️</div>
      <div class="msg" id="error-msg">Error desconocido</div>
      <div class="actions">
        <button id="btn-retry">Reintentar</button>
        <button id="btn-close-err">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="shoulder-buttons">
      <button id="btn-l">L</button>
      <button id="btn-r">R</button>
    </div>
    <div id="dpad">
      <button id="dpad-up">▲</button>
      <button id="dpad-down">▼</button>
      <button id="dpad-left">◀</button>
      <button id="dpad-right">▶</button>
    </div>
    <div id="face-buttons">
      <button id="btn-b">B</button>
      <button id="btn-a">A</button>
    </div>
    <div id="sys-buttons">
      <button id="btn-select">SELECT</button>
      <button id="btn-start">START</button>
    </div>
  </div>

  <div id="status">
    <span id="status-rom">—</span>
    <span class="fps" id="status-fps">— FPS</span>
  </div>
  <div id="keys-hint">
    Z=A &nbsp; X=B &nbsp; A=L &nbsp; S=R &nbsp; Enter=Start &nbsp; V=Select &nbsp; Flechas=D-Pad
  </div>
</div>

<div id="log-panel">
  <div id="diag"></div>
  <div class="toolbar">
    <button id="log-copiar">Copiar</button>
    <button id="log-limpiar">Limpiar</button>
    <span class="crece" id="log-nota">El log del editor en vivo</span>
  </div>
  <div id="log-vacio">Sin mensajes todavía.</div>
  <div id="log-list"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Emulador GBA — EmulatorJS (core mGBA/WebAssembly), self-hosteado en ./ejs/
//
// Esta página la comparten los TRES destinos:
//   ?mode=editor → ventana Play del editor (con el chrome de abajo)
//   ?mode=game   → reproductor "sellado" del export web y del .exe
//
// ?rom= debe ser una URL que el core pueda bajar con fetch():
//   app://rom/mijuego.gba   en Electron
//   game.gba                en el export web (relativa a esta página)
// ═══════════════════════════════════════════════════════════════════════════
(function () {
'use strict';

const params = new URLSearchParams(location.search);
const ROM_URL = params.get('rom');
const MODE = params.get('mode') === 'game' ? 'game' : 'editor';

const screenWrapper = document.getElementById('screen-wrapper');
const errorOverlay = document.getElementById('error-overlay');
const errorMsg = document.getElementById('error-msg');
const statusRom = document.getElementById('status-rom');
const statusFps = document.getElementById('status-fps');
const titlebar = document.getElementById('titlebar');

// ── Estado observable ─────────────────────────────────────────────────────
// Lo leen el test de Playwright y Electron (para saber si de verdad arrancó).
window.__advanceEmu = {
  state: 'boot',      // boot → loading → ready → started | error | closed
  error: null,
  rom: ROM_URL,
  mode: MODE,
  romName: ROM_URL ? ROM_URL.split('/').pop().split('?')[0] : null,
  frames: 0,
  /** Momento en ms en que el juego arrancó (para el tiempo de arranque). */
  startedAt: 0,
};

const setState = (state, err) => {
  window.__advanceEmu.state = state;
  if (err) window.__advanceEmu.error = String(err);
  // Electron escucha esto para alimentar el log del editor.
  if (window.__advanceEmuBridge) {
    try { window.__advanceEmuBridge.report(state, window.__advanceEmu.error); } catch (_) {}
  }
};

function showError(msg) {
  setState('error', msg);
  screenWrapper.classList.remove('loading');
  errorMsg.textContent = String(msg).slice(0, 300);
  errorOverlay.classList.add('visible');
}

// ── Errores globales ──────────────────────────────────────────────────────
// OJO: Wake Lock y autoplay fallan sin gesto del usuario y son ruido, no fallos
// del emulador. Se ignoran para no enseñar errores falsos.
const IGNORABLE = /Wake Lock|NotAllowedError|play\(\) request|user gesture|AudioContext/i;
window.addEventListener('unhandledrejection', (e) => {
  const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  if (IGNORABLE.test(msg)) return;
  showError('Error inesperado: ' + msg);
});
window.onerror = (msg) => {
  const text = String(msg || '');
  if (IGNORABLE.test(text)) return false;
  showError('Error: ' + text);
  return false;
};

// ── Configuración de EmulatorJS ───────────────────────────────────────────
// Los assets están en ./ejs/ (ver scripts/fetch-emulatorjs.mjs y PROVENANCE.md).
// EJS_paths deja el 'version.json' en local: anula el fetch a raw.githack.com
// que hace loader.js para comprobar si hay versión nueva.
const EJS_BASE = './ejs/';
window.EJS_player = '#gba-mount';
window.EJS_core = 'gba';                    // resuelve al core 'mgba' vía cores.json
window.EJS_pathtodata = EJS_BASE;
window.EJS_gameUrl = ROM_URL;
window.EJS_gameName = window.__advanceEmu.romName || 'advance';
window.EJS_gameID = 1;
window.EJS_language = 'es-ES';
window.EJS_startOnLoaded = true;
window.EJS_color = '#3b82f6';
window.EJS_backgroundColor = '#000000';
window.EJS_threads = false;                 // sin hilos: no hay cabeceras COOP/COEP
window.EJS_cacheConfig = { enabled: false };
window.EJS_volume = 0.6;
window.EJS_fixedSaveInterval = 5000;
// Absoluta a propósito: EJS espera una URL, y si no la reconoce cae al CDN
// (se vio pedir https://cdn.emulatorjs.org/stable/data/version.json). Con esto
// el export web y el .exe no salen nunca a Internet.
window.EJS_paths = { 'version.json': new URL('ejs/version.json', location.href).href };

// Fuera toda la barra de EJS: el chrome de esta página trae sus propios
// controles y el export sellado no puede enseñar botones de guardado/carga.
window.EJS_Buttons = {
  playPause: false, play: false, pause: false,
  restart: false,
  mute: false, unmute: false, volume: false,
  settings: false,
  fullscreen: false, enterFullscreen: false, exitFullscreen: false,
  saveState: false, loadState: false, quickSave: false, quickLoad: false,
  saveSavFiles: false, loadSavFiles: false,
  screenRecord: false, screenshot: false,
  cheat: false, gamepad: false,
  cacheManager: false, exitEmulation: false,
};
window.EJS_hideSettings = ['shader', 'save-state-location', 'save-state-slot', 'netplay', 'cheat', 'cache-manager'];
window.EJS_askBeforeExit = false;

// Teclado: Z=A, X=B, Enter=START, V=Select, A=L, S=R, flechas=DPad.
//
// OJO: los índices NO son los bits de REG_KEYINPUT del GBA, y tampoco lo que
// dicen los nombres de EJS (BUTTON_1 resulta ser la B del GBA, y la A está en
// el índice 8). Esta tabla está MEDIDA sobre el core mgba de EJS 4.2.3, que es
// lo único que vale:
//
//    8 → A        0 → B        2 → SELECT    3 → START
//    7 → DERECHA  6 → IZQUIERDA  4 → ARRIBA  5 → ABAJO
//   11 → R       10 → L
//
// Antes se usaban 0..3 para A/B/SELECT/START y 12..15 para el d-pad (que son
// DPAD_* en la nomenclatura de EJS, pero no los entiende este core): por eso
// A pulsaba B, el d-pad no movía nada y L/R no llegaban.
//
// Además el nombre de la tecla debe existir en la tabla interna de EJS
// (keyLookup): 'backslash' no está, así que SELECT usa 'v'.
//
// Los cuatro puestos tienen que existir aunque solo se configure el 0, porque
// setupKeys() recorre los cuatro.
window.EJS_defaultControls = {
  0: {
    8:  { value: 'z',           value2: 'SELECT' },        // SELECT de EJS = botón A
    0:  { value: 'x',           value2: 'BUTTON_1' },      // BUTTON_1 = botón B
    2:  { value: 'v',           value2: 'BUTTON_3' },      // SELECT
    3:  { value: 'enter',       value2: 'BUTTON_4' },      // START
    4:  { value: 'up arrow',    value2: 'LEFT_TOP_SHOULDER' },
    5:  { value: 'down arrow',  value2: 'RIGHT_TOP_SHOULDER' },
    6:  { value: 'left arrow',  value2: 'LEFT_BOTTOM_SHOULDER' },
    7:  { value: 'right arrow', value2: 'RIGHT_BOTTOM_SHOULDER' },
    10: { value: 'a',           value2: 'LEFT_STICK' },    // L
    11: { value: 's',           value2: 'RIGHT_STICK' },   // R
  },
  1: {},
  2: {},
  3: {},
};

window.EJS_ready = function () { setState('ready'); };
window.EJS_onGameStart = function () {
  setState('started');
  window.__advanceEmu.startedAt = performance.now();
  // EJS escucha el teclado en elements.parent (este mismo div), así que hace
  // falta que el foco esté aquí dentro: si se queda en body, las teclas reales
  // no pasan por el contenedor al propagarse y el juego no ve nada.
  // tabindex="-1" (el que pone EJS) no es focusable por script en todos los
  // casos; con tabindex="0" sí.
  try { document.getElementById('gba-mount')?.focus({ preventScroll: true }); } catch (_) {}
};
window.EJS_onExit = function () { setState('closed'); };

// ── Arranque ──────────────────────────────────────────────────────────────
function boot() {
  if (!ROM_URL) {
    showError('No se indicó la ROM (?rom=).');
    return;
  }
  setState('loading');
  if (statusRom) statusRom.textContent = window.__advanceEmu.romName || ROM_URL;
  // loader.js se inyecta desde aquí (no con un <script src>) para poder
  // capturar onerror y avisar si falta la carpeta ejs/.
  loadScript();
}

function loadScript() {
  const s = document.createElement('script');
  s.src = EJS_BASE + 'loader.js';
  s.onload = launch;
  s.onerror = () => showError(
    'No se pudo cargar ejs/loader.js. Faltan los assets de EmulatorJS — ' +
    'ejecuta "node scripts/fetch-emulatorjs.mjs".'
  );
  document.head.appendChild(s);
}

function launch() {
  // loader.js (4.2.3) es un IIFE async: carga emulator.min.js y luego construye
  // window.EJS_emulator él mismo. No hay que instanciarlo a mano (si se hace
  // aquí, EmulatorJS aún no está definido y revienta), solo esperar a que exista.
  esperarEmulador(0);
}

function esperarEmulador(intentos) {
  if (window.EJS_emulator) return;

  if (intentos > 150) {
    showError(
      'EmulatorJS no llegó a arrancar. Revisa que public/emulator/ejs/ tenga los ' +
      'assets (node scripts/fetch-emulatorjs.mjs) y que la página se sirva por ' +
      'http:// — en file:// el navegador no deja descargar el core.'
    );
    return;
  }
  setTimeout(() => esperarEmulador(intentos + 1), 100);
}

if (MODE === 'game') {
  document.title = window.__advanceEmu.romName || 'Juego';
}

// ── Contador de FPS ───────────────────────────────────────────────────────
// EJS no publica ningún evento de fotograma, y leer el canvas NO vale: es WebGL
// sin preserveDrawingBuffer, así que un drawImage() devuelve negro siempre.
// Lo que sí es real es contar las llamadas de dibujo: el core pinta una vez por
// fotograma, así que dibujar ≈ 60 veces por segundo es ir a 60 fps de verdad.
(function fpsMeter() {
  const mount = document.getElementById('gba-mount');
  if (!mount) return;

  const DRAW_METHODS = ['drawElements', 'drawArrays', 'drawElementsInstanced', 'drawArraysInstanced'];
  let envuelto = null;
  let draws = 0;

  function envolver() {
    // OJO: solo cuando el juego YA arrancó. Un canvas solo admite un tipo de
    // contexto, así que si preguntamos antes de que EJS cree el suyo se lo
    // adjudicamos nosotros, EJS pide el que quiere, recibe null y no arranca nada.
    if (window.__advanceEmu.state !== 'started') return;

    const canvas = window.EJS_emulator?.canvas || mount.querySelector('canvas');
    if (!canvas || !canvas.width) return;

    // EJS pone el canvas a 0x0 cuando el contenedor se oculta (pestaña Registro),
    // así que el tamaño y el tipo de contexto se apuntan aquí para no perderlos.
    window.__advanceEmu.canvasW = canvas.width;
    window.__advanceEmu.canvasH = canvas.height;

    if (envuelto && envuelto.canvas === canvas) return;

    // Con el tipo correcto, getContext devuelve el contexto YA creado por EJS.
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!gl) return;
    if (!window.__advanceEmu.webgl) {
      window.__advanceEmu.webgl = canvas.getContext('webgl2') ? 'WebGL 2' : 'WebGL 1';
    }

    for (const name of DRAW_METHODS) {
      const fn = gl[name];
      if (typeof fn !== 'function' || fn.__advanceEmuWrapped) continue;
      const original = fn.bind(gl);
      const contador = function (...args) {
        draws++;
        return original(...args);
      };
      contador.__advanceEmuWrapped = true;
      gl[name] = contador;
    }
    envuelto = { canvas, gl };
  }

  // EJS puede recrear el canvas (cambio de WebGL, resize), así que se reintenta.
  envolver();
  setInterval(envolver, 250);

  let anterior = 0;
  setInterval(() => {
    const porSegundo = Math.max(0, draws - anterior);
    anterior = draws;

    window.__advanceEmu.drawCalls = draws;
    window.__advanceEmu.fps = porSegundo;
    window.__advanceEmu.everDrawn = draws > 0;

    if (statusFps) {
      statusFps.textContent = porSegundo > 0 ? porSegundo + ' FPS' : '— FPS';
    }
  }, 1000);
})();

// ── Botones en pantalla ────────────────────────────────────────────────────
// EJS NO escucha en window: se engancha a elements.parent (el contenedor del
// jugador) y compara t.keyCode, no t.code. Por eso un evento sintético lanzado
// en window no llegaba a la ROM (el test lo cazó: la tecla de verdad sí, el
// botón en pantalla no).
const KEYCODES = {
  KeyZ: 90, KeyX: 88, KeyV: 86, Enter: 13,
  ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
  KeyA: 65, KeyS: 83,
};

const BTN_CODE = {
  'btn-a': 'KeyZ', 'btn-b': 'KeyX',
  'btn-select': 'KeyV', 'btn-start': 'Enter',
  'dpad-up': 'ArrowUp', 'dpad-down': 'ArrowDown',
  'dpad-left': 'ArrowLeft', 'dpad-right': 'ArrowRight',
  'btn-l': 'KeyA', 'btn-r': 'KeyS',
};

/** Nodo al que EJS engancha sus oyentes de teclado. */
function nodoEjs() {
  return window.EJS_emulator?.elements?.parent || document.getElementById('gba-mount');
}

function sendKey(code, down) {
  const target = nodoEjs();
  if (!target) return;

  const keyCode = KEYCODES[code] ?? 0;
  const key = code.startsWith('Arrow') ? code.slice(5).toLowerCase() : code.replace(/^Key/, '').toLowerCase();

  const ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key,
    code,
    keyCode,          // EJS compara t.keyCode (Chrome lo acepta en el init dict)
    which: keyCode,
    charCode: 0,
    bubbles: true,
    cancelable: true,
  });
  target.dispatchEvent(ev);
}

const keysHeld = new Set();

for (const [id, code] of Object.entries(BTN_CODE)) {
  const el = document.getElementById(id);
  if (!el) continue;

  const down = (e) => {
    e.preventDefault();
    el.classList.add('pressed');
    if (!keysHeld.has(code)) { keysHeld.add(code); sendKey(code, true); }
  };
  const up = (e) => {
    e.preventDefault();
    el.classList.remove('pressed');
    if (keysHeld.has(code)) { keysHeld.delete(code); sendKey(code, false); }
  };

  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}

// ── Teclado ───────────────────────────────────────────────────────────────
// Mismo mapa que BTN_CODE para que los botones se iluminen al teclear.
const CODE_TO_BTN = {
  KeyZ: 'btn-a', KeyX: 'btn-b', KeyV: 'btn-select', Enter: 'btn-start',
  ArrowUp: 'dpad-up', ArrowDown: 'dpad-down', ArrowLeft: 'dpad-left', ArrowRight: 'dpad-right',
  KeyA: 'btn-l', KeyS: 'btn-r',
};
const held = new Set();

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || (e.ctrlKey && e.key === 'w')) { closeEmulator(); return; }
  const btn = CODE_TO_BTN[e.code];
  if (!btn) return;

  // Respaldo: si el evento no ha pasado por el contenedor de EJS (porque el
  // foco estaba en otro sitio), se le reenvía. Si ya pasó por ahí, contains()
  // da true y no se duplica.
  const mount = document.getElementById('gba-mount');
  if (mount && !mount.contains(e.target)) sendKey(e.code, true);
  if (!held.has(e.code)) {
    held.add(e.code);
    const el = document.getElementById(btn);
    if (el) el.classList.add('pressed');
  }
  // No hacemos preventDefault: EJS ya gestiona el teclado del juego.
});
window.addEventListener('keyup', (e) => {
  const btn = CODE_TO_BTN[e.code];
  if (!btn) return;

  const mount0 = document.getElementById('gba-mount');
  if (mount0 && !mount0.contains(e.target)) sendKey(e.code, false);

  held.delete(e.code);
  const el = document.getElementById(btn);
  if (el) el.classList.remove('pressed');
});
// Si se sueltan varias a la vez (alt-tab), limpiar las que se quedaron pegadas.
window.addEventListener('blur', () => {
  held.clear();
  keysHeld.clear();
  document.querySelectorAll('.pressed').forEach((el) => el.classList.remove('pressed'));
});

// ── Ventana ────────────────────────────────────────────────────────────────
function closeEmulator() {
  setState('closed');
  try { if (window.EJS_emulator) window.EJS_emulator.stop(); } catch (_) {}
  window.close();
}
document.getElementById('btn-close')?.addEventListener('click', closeEmulator);
document.getElementById('btn-close-err')?.addEventListener('click', closeEmulator);
document.getElementById('btn-retry')?.addEventListener('click', () => location.reload());
window.addEventListener('beforeunload', () => setState('closed'));

// En modo juego no hay titlebar ni botones: el .exe va directo al juego.
if (MODE === 'game') {
  titlebar?.remove();
  document.getElementById('controls')?.remove();
  document.getElementById('keys-hint')?.remove();
}

boot();
})();

// ═══════════════════════════════════════════════════════════════════════════
// Pestaña Registro: el log del editor en vivo + el estado del emulador
//
// Lo que NO se puede ver aquí: lo que el juego imprime. EJS no da acceso a la
// memoria de la GBA, el registro de depuración de mGBA (0x4FFF780) no llega al
// navegador y el buffer de la SRAM sale borrado, así que un printf dentro de la
// ROM no se puede recoger desde fuera (haría falta compilar el propio mGBA a
// WASM). Lo que sí es fiable es esto: lo que pasó al compilar y cómo va el
// emulador, sin tener que cambiar a la pestaña Mundo del editor.
// ═══════════════════════════════════════════════════════════════════════════
(function logPanel() {
  const tabJuego = document.getElementById('tab-juego');
  const tabLog = document.getElementById('tab-log');
  const panelLog = document.getElementById('log-panel');
  const container = document.getElementById('container');
  const lista = document.getElementById('log-list');
  const vacio = document.getElementById('log-vacio');
  const diag = document.getElementById('diag');
  const contador = document.getElementById('log-contador');
  const nota = document.getElementById('log-nota');

  if (!tabLog || !panelLog) return;

  const MAX_LINEAS = 800;
  let lineas = [];
  let errores = 0;

  function clase(msg) {
    if (msg.startsWith('[ERROR]')) return 'error';
    if (msg.startsWith('[OK]')) return 'ok';
    if (msg.startsWith('[WARN]')) return 'warn';
    if (msg.startsWith('[INFO]')) return 'info';
    return '';
  }

  function anadir(msg) {
    lineas.push(msg);
    if (lineas.length > MAX_LINEAS) lineas = lineas.slice(-MAX_LINEAS);

    const div = document.createElement('div');
    div.className = 'l ' + clase(msg);
    div.textContent = msg;
    lista.appendChild(div);
    lista.scrollTop = lista.scrollHeight;
    vacio.style.display = 'none';

    if (clase(msg) === 'error') {
      errores++;
      contador.textContent = String(errores);
      contador.hidden = false;
    }
  }

  function pintar() {
    lista.textContent = '';
    errores = 0;
    for (const m of lineas) {
      const div = document.createElement('div');
      div.className = 'l ' + clase(m);
      div.textContent = m;
      lista.appendChild(div);
      if (clase(m) === 'error') errores++;
    }
    vacio.style.display = lineas.length ? 'none' : 'block';
    lista.scrollTop = lista.scrollHeight;
    contador.hidden = errores === 0;
    contador.textContent = String(errores);
  }

  function verLog() {
    container.style.display = 'none';
    panelLog.classList.add('activo');
    tabLog.classList.add('activo');
    tabJuego.classList.remove('activo');
    refrescarDiag();
  }

  function verJuego() {
    panelLog.classList.remove('activo');
    container.style.display = '';
    tabJuego.classList.add('activo');
    tabLog.classList.remove('activo');
    try { document.getElementById('gba-mount')?.focus({ preventScroll: true }); } catch (_) {}
  }

  tabJuego.addEventListener('click', verJuego);
  tabLog.addEventListener('click', verLog);

  // ── Diagnóstico del emulador ──────────────────────────────────────────
  const CELDAS = [
    ['Estado', (e) => e.state, (v) => (v === 'started' ? 'ok' : v === 'error' ? 'malo' : '')],
    ['FPS', (e) => (e.fps > 0 ? e.fps + '' : '—'), (v) => (v === '—' ? '' : 'ok')],
    ['Frames', (e) => (e.drawnFrames ?? 0) + '', () => ''],
    ['Core', () => (window.EJS_emulator?.ejs_version ? 'mGBA/WASM' : '—'), () => ''],
    ['Resolución', (e) => (e.canvasW ? e.canvasW + 'x' + e.canvasH : '—'), () => ''],
    ['WebGL', (e) => (e.webgl ? e.webgl : '—'), () => ''],
    ['ROM', (e) => e.romName || '—', () => ''],
    ['Arranque', (e) => (e.startedAt ? ((performance.now() - e.startedAt) / 1000).toFixed(1) + ' s' : '—'), () => ''],
  ];

  function refrescarDiag() {
    const e = window.__advanceEmu || {};
    if (!diag) return;
    diag.textContent = '';
    for (const [clave, leer, tono] of CELDAS) {
      let v;
      try { v = String(leer(e)); } catch (_) { v = '—'; }
      const celda = document.createElement('div');
      celda.className = 'celda';
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = clave;
      const val = document.createElement('span');
      val.className = 'v ' + tono(v);
      val.textContent = v;
      celda.appendChild(k);
      celda.appendChild(val);
      diag.appendChild(celda);
    }
  }

  document.getElementById('log-copiar')?.addEventListener('click', () => {
    try { navigator.clipboard.writeText(lineas.join('\n')); } catch (_) {}
  });
  document.getElementById('log-limpiar')?.addEventListener('click', () => {
    lineas = [];
    pintar();
  });

  // Refresco del diagnóstico mientras la pestaña esté visible.
  setInterval(() => {
    if (panelLog.classList.contains('activo')) refrescarDiag();
  }, 1000);

  // ── Log en vivo desde el editor ───────────────────────────────────────
  if (window.__advanceEmuBridge?.onLog) {
    window.__advanceEmuBridge.onLog(({ msg }) => anadir(msg));
  } else {
    // Sin preload (export web, .exe): el shell funciona igual, solo sin log.
    if (nota) nota.textContent = 'El log del editor no está disponible fuera de la app';
  }

  window.__advanceEmuLog = { anadir, ver: verLog };
})();
</script>
</body>
</html>
